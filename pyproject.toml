[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpt-process-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<0.12", "python-docx>=1.2,<2", "python-pptx>=1.0,<2", "openai>=2,<3", "jsonschema>=4.23,<5", "python-dotenv>=1.0,<2"]

[project.scripts]
bpt-extract = "bpt_process_agent.ingestion.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
